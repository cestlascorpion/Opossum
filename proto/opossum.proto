syntax = "proto3";

package Opossum;

option go_package = "github.com/cestlascorpion/opossum/proto;opossum";

service Opossum {
  rpc AllocSegment (AllocSegmentReq) returns (AllocSegmentResp) {}
  rpc GetSnowflakes (GetSnowflakesReq) returns (GetSnowflakesResp) {}
}

message AllocSegmentReq {
  string key = 1;
}

message AllocSegmentResp {
  int64 start = 1;
  int64 end = 2;
}

message GetSnowflakesReq {
  uint32 count = 1;
}

message GetSnowflakesResp {
  repeated int64 ids = 1;
}
